<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2d3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162B20" />
      <stop offset="100%" stop-color="#244533" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg2d3)" rx="12" />
  <!-- Social Media & Ad Creative Mockup -->
  <g transform="translate(170, 70)">
    <!-- Smartphone / Post Ad Card -->
    <rect width="460" height="460" rx="16" fill="#FFFFFF" stroke="#D4E8DD" stroke-width="2" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.25))" />
    <!-- User Info Header -->
    <g transform="translate(25, 25)">
      <circle cx="20" cy="20" r="18" fill="#5BAA6F" />
      <text x="50" y="20" fill="#213331" font-family="'Inter', sans-serif" font-weight="700" font-size="14">Arinda Food Campaign</text>
      <text x="50" y="34" fill="#4A635E" font-family="'Inter', sans-serif" font-size="11">Sponsored • Meta Ads</text>
    </g>
    <!-- Ad Creative Visual -->
    <rect x="25" y="75" width="410" height="250" rx="8" fill="#EDFBF0" stroke="#D4E8DD" stroke-width="1" />
    <!-- Graphic Composition Inside Ad -->
    <circle cx="230" cy="200" r="80" fill="#F7FFF8" stroke="#7FCD91" stroke-width="2" />
    <text x="145" y="195" fill="#213331" font-family="'Inter', sans-serif" font-weight="700" font-size="20">Flash Sale Deal</text>
    <text x="135" y="220" fill="#2E7D52" font-family="'Space Mono', monospace" font-weight="700" font-size="15">UP TO 40% OFF</text>
    <!-- Engagement Bar Mockup -->
    <g transform="translate(25, 345)">
      <text x="10" y="20" fill="#213331" font-family="'Inter', sans-serif" font-weight="600" font-size="13">❤️ 1.4K Likes • 💬 280 Comments • 🔁 95 Shares</text>
      <rect x="280" y="2" width="120" height="30" rx="6" fill="#2E7D52" />
      <text x="315" y="22" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Order Now</text>
    </g>
    <!-- Metric Tag -->
    <rect x="25" y="405" width="410" height="35" rx="6" fill="#F7FFF8" stroke="#D4E8DD" stroke-width="1" />
    <text x="45" y="428" fill="#4A635E" font-family="'Inter', sans-serif" font-size="12">📈 Target ROAS: 3.4x • Organic reach increased by 45%</text>
  </g>
</svg>
